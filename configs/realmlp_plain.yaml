# realmlp_plain.yaml — Reproduce _realmlp_oof.npy (OOF=0.95058, LB=0.95061)
# This is the ORIGINAL RealMLP model used in champion_v1's 4way_numte_blend
# Generated by early version of _realmlp_train.py (before GP features were added)
#
# FE: yekenot basic (6 cat + 7 num + 3 num2cat + 2 kbins + 1 heart_bmi + sleep_cat + sleep_interact = ~30 base features)
#     + per-fold TE on all cat cols -> ~76 features total
# Model: n_ens=8, hidden=[512,512,512], epochs=2, seed=42
#
# KEY DIFFERENCES from _realmlp_ref:
#   - epochs=2 (not 3)
#   - seed=42 (not 63)
#   - No GP features (gp_features=false)
#   - No extra cat features (extra_cat_features=false)
#   - No water_intake .round() (water_intake_round=false)
#   - stress_pal=false (only heart_rate_bmi_ interaction)
#
# Can be reproduced by:
#   python run_v2.py configs/realmlp_plain.yaml
# (remove legacy_oof to train from scratch)

name: realmlp_plain

models:
  - name: RM_plain
    model_type: RealMLP
    legacy_oof: _realmlp
    n_splits: 7
    fe_config:
      stress_pal: false
      gp_features: false
      extra_cat_features: false
      water_intake_round: false
      sleep_cat: false
      te: true
    params:
      n_ens: 8
      hidden_dims: [512, 512, 512]
      dropout: 0.06
      epochs: 2
      flat_ratio: 0.3
      random_state: 42
      lr: 0.01
      mom: 0.9
      sq_mom: 0.98
      weight_decay: 0.013
      ema_decay: 0.997875
      grad_clip: 1.2
      ls_eps: 0.04
      ls_eps_sched: cos
      p_drop_sched: expm4t
      embed_dim: 8
      onehot_thresh: 8
      activation: SiLU
      add_front_scale: true
      pbld_hidden_dim: 20
      pbld_out_dim: 5
      pbld_freq_scale: 5.0
      pbld_activation: PReLU
      pbld_lr_factor: 0.093
      first_layer_lr_factor: 1.0
      first_layer_wd_factor: 0.1
      lr_scale_mult: 10.0
      lr_bias_mult: 0.1
      wd_scale_mult: 0.1
      wd_bias_mult: 0.5
      tfms: [median_center, robust_scale]
      train_bs: 256
      eval_bs: 10240
      use_early_stopping: false

blend:
  components:
    - name: RM_plain
      models: [RM_plain]
      inner: single
  method: components
