# drop_water.yaml — 13d minus water_intake = 12d
name: drop_water

fe:
  no_water:
    num2cat: false
    stress_pal: false
    num_fill: median
    te: false
    drop_features: [water_intake]

models:
  - name: XGB
    fe: no_water
    n_splits: 5

  - name: CB
    fe: no_water
    n_splits: 5

  - name: HGB
    fe: no_water
    n_splits: 5

blend:
  components:
    - name: GB_A
      models: [XGB, CB, HGB]
      inner: equal
      weight: 1.0
