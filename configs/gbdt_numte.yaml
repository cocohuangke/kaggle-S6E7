# gbdt_numte.yaml — Reproduce _fe_A_num2cat_numte_{XGB,CB,HGB}_oof.npy
# Generated by archive_v1/scripts/_fe_numte_test.py
#
# FE: A_num2cat (calorie_cat_, water_cat2_, step_cat_) + stress_pal + num TE ONLY
#     - 7 numeric cols converted to strings -> TargetEncoder -> 21 num TE features
#     - NO cat TE (only numeric TE)
#     - XGB: 17d (7 num + 10 cat, NO TE) — TE hurts XGB
#     - CB/HGB: 38d (17 + 21 num TE)
#     - All models: 7-fold CV, original script uses random_state=42
#
# Can be reproduced by:
#   python run_v2.py configs/gbdt_numte.yaml
# (remove legacy_oof to train from scratch; update random_state=42 in params)

name: gbdt_numte

fe:
  A_num2cat_numte:
    num2cat: true
    stress_pal: true
    num_fill: median
    te: false          # no cat TE
    num_te: true       # numeric TE
    te_folds: 7        # 7-fold TE (matches original script)

models:
  # XGB: base features only (no TE columns) — 17d
  - name: XGB
    legacy_oof: _fe_A_num2cat_numte_XGB
    fe: A_num2cat_numte
    feature_subset: base
    n_splits: 7
    params:
      n_estimators: 1500
      learning_rate: 0.05
      max_depth: 7
      min_child_weight: 50
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      tree_method: hist
      device: cuda
      random_state: 42
      verbosity: 0
      early_stopping_rounds: 50

  # CatBoost: full features (with num TE) — 38d
  - name: CB
    legacy_oof: _fe_A_num2cat_numte_CB
    fe: A_num2cat_numte
    feature_subset: all
    n_splits: 7
    params:
      iterations: 1500
      learning_rate: 0.05
      depth: 5
      l2_leaf_reg: 1.0
      auto_class_weights: Balanced
      task_type: GPU
      random_seed: 42
      verbose: 0
      early_stopping_rounds: 100

  # HistGB: full features (with num TE) — 38d
  - name: HGB
    legacy_oof: _fe_A_num2cat_numte_HGB
    fe: A_num2cat_numte
    feature_subset: all
    n_splits: 7
    params:
      max_iter: 1000
      learning_rate: 0.05
      max_depth: 8
      min_samples_leaf: 50
      l2_regularization: 1.0
      max_leaf_nodes: 31
      class_weight: balanced
      random_state: 42
      verbose: 0
      early_stopping: true
      n_iter_no_change: 50
      validation_fraction: 0.1

blend:
  components:
    - name: GB_eq
      models: [XGB, CB, HGB]
      inner: equal
