# ref_blend.yaml — New RealMLP (reference-matched) + GB_A grid search
name: ref_blend

fe:
  A_num2cat_9d:
    num2cat: true
    stress_pal: true
    num_fill: median
    te: false
    drop_features: [heart_rate, calorie_expenditure, gender, diet_type]

models:
  - name: XGB
    fe: A_num2cat_9d
    n_splits: 5

  - name: CB
    fe: A_num2cat_9d
    n_splits: 5

  - name: HGB
    fe: A_num2cat_9d
    n_splits: 5

  - name: RealMLP
    fe: A_num2cat_9d
    n_splits: 7
    legacy_oof: _realmlp_ref

blend:
  components:
    - name: RM
      models: [RealMLP]
      weight: 0.55

    - name: GB_A
      models: [XGB, CB, HGB]
      inner: equal
      weight: 0.45

  grid_search: true
  grid_step: 1
