# realmlp_ref.yaml — Reproduce _realmlp_ref_oof.npy (OOF=0.95060, LB=0.95074)
# Generated by run_refactored_realmlp.py (reference notebook reproduction)
#
# FE: yekenot full (stress_pal=False, gp_features=True, extra cat features, TE)
# Model: n_ens=8, hidden=[512,512,512], epochs=3, seed=63
#
# Can be reproduced by:
#   python run_v2.py configs/realmlp_ref.yaml
# (remove legacy_oof to train from scratch)

name: realmlp_ref

models:
  - name: RM_ref
    model_type: RealMLP
    legacy_oof: _realmlp_ref
    n_splits: 7
    fe_config:
      stress_pal: false
      gp_features: true
      te: true
    params:
      n_ens: 8
      hidden_dims: [512, 512, 512]
      dropout: 0.06
      epochs: 3
      flat_ratio: 0.3
      random_state: 63
      lr: 0.01
      mom: 0.9
      sq_mom: 0.98
      weight_decay: 0.013
      ema_decay: 0.997875
      grad_clip: 1.2
      ls_eps: 0.04
      ls_eps_sched: cos
      p_drop_sched: expm4t
      embed_dim: 8
      onehot_thresh: 8
      activation: SiLU
      add_front_scale: true
      pbld_hidden_dim: 20
      pbld_out_dim: 5
      pbld_freq_scale: 5.0
      pbld_activation: PReLU
      pbld_lr_factor: 0.093
      first_layer_lr_factor: 1.0
      first_layer_wd_factor: 0.1
      lr_scale_mult: 10.0
      lr_bias_mult: 0.1
      wd_scale_mult: 0.1
      wd_bias_mult: 0.5
      tfms: [median_center, robust_scale]
      train_bs: 256
      eval_bs: 10240
      use_early_stopping: false

blend:
  components:
    - name: RM_ref
      models: [RM_ref]
      inner: single
  method: components
